name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Manual trigger. A push event that arrives during a GitHub Actions outage is
  # LOST, not queued — no run is created, and none is backfilled once service
  # returns. Without this, the only way to verify an already-pushed commit is a
  # synthetic follow-up commit. Run with: gh workflow run ci.yml --ref main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm run typecheck

      - name: Lint
        run: pnpm run lint

      - name: Format check
        run: pnpm run format:check

      # Structural half only. The claim sweep needs the round's old wording as
      # arguments and is run by hand; see the script header.
      - name: Docs structure
        if: matrix.os == 'ubuntu-latest'
        run: pnpm run docs:sweep

      - name: Docs check
        run: pnpm run docs:check

      - name: CI gate coverage
        if: matrix.os == 'ubuntu-latest'
        run: pnpm run gates:check

      - name: Decisions reciprocity
        if: matrix.os == 'ubuntu-latest'
        run: pnpm run decisions:check

      - name: Public surface
        if: matrix.os == 'ubuntu-latest'
        run: pnpm run surface:check

      - name: Entry parity
        if: matrix.os == 'ubuntu-latest'
        run: pnpm run entries:check

      - name: Audit (prod, high+)
        if: matrix.os == 'ubuntu-latest'
        run: pnpm run audit

      - name: Test
        run: pnpm run test:coverage

      - name: Upload coverage
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage
          path: |
            coverage/
            packages/*/coverage/
          if-no-files-found: warn
          retention-days: 14

      # One upload PER PACKAGE, each carrying its own flag. A single upload of
      # both lcov files would merge them into one project number and lose the
      # per-package view; flags add that view without giving up the aggregate,
      # which Codecov still computes across every flag. The flags are declared
      # in `codecov.yml`, and each package's README carries its own badge.
      #
      # `type-identity` is deliberately absent — still private, and its single
      # importability test would only dilute the numbers. `custom-namespace`
      # joined on 2026-09-04 when it met the trigger below.
      #
      # A package joins in FOUR places at once, on the commit that makes it
      # PUBLISHABLE — a frozen spec, a suite derived from it, and coverage
      # clearing the workspace thresholds (ADR #092, as amended 2026-09-03):
      # here, in `codecov.yml`, in its own README, and in the root README's
      # Coverage column. Surface alone is NOT the trigger; the earlier wording
      # said it was, and both scaffolds passed it while proving nothing.
      #
      # `fail_ci_if_error` is TRUE on purpose. A silently failing upload leaves
      # the badge grey forever and nothing goes red — the same
      # green-for-the-wrong-reason shape the other gates exist to prevent.
      #
      # It stays TRUE, and the DEPENDABOT ACTOR is excluded instead. A
      # Dependabot-triggered run is served the Dependabot secrets store rather
      # than the Actions one, so `secrets.CODECOV_TOKEN` is empty there and the
      # upload cannot authenticate — Codecov answers "Token required because
      # branch is pr". With `fail_ci_if_error` that turned EVERY Dependabot PR
      # red at this step, and skipped everything after it: Build, Smoke,
      # pack:check and check:publish never ran on a single bump. A gate that
      # fires identically for a safe bump and a broken one carries no signal,
      # and the five PRs open on 2026-08-20 were red for exactly this reason,
      # not for anything they changed.
      #
      # Excluding the actor — rather than testing the token for emptiness —
      # keeps the loud failure everywhere it can still happen. On `main` and on
      # every human-authored PR the upload runs and a genuinely missing token
      # fails the build, which is what the TRUE was written to guarantee. Only
      # the case that is structurally impossible is skipped.
      #
      # Coverage from a bump PR is no loss: a dependency bump does not touch
      # `src/`, so its coverage delta is zero by construction.
      #
      # The alternative — adding CODECOV_TOKEN to the repository's Dependabot
      # secrets — would also work and would additionally upload from bump PRs.
      # It is not taken: it places a credential within reach of a run whose
      # whole purpose is to install a dependency version nobody has reviewed
      # yet, to buy a coverage delta that is always zero.
      - name: Upload type-detection coverage to Codecov
        if: matrix.os == 'ubuntu-latest' && github.actor != 'dependabot[bot]'
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          files: ./packages/type-detection/coverage/lcov.info
          flags: type-detection
          fail_ci_if_error: true
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: Upload function-introspection coverage to Codecov
        if: matrix.os == 'ubuntu-latest' && github.actor != 'dependabot[bot]'
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          files: ./packages/function-introspection/coverage/lcov.info
          flags: function-introspection
          fail_ci_if_error: true
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: Upload custom-namespace coverage to Codecov
        if: matrix.os == 'ubuntu-latest' && github.actor != 'dependabot[bot]'
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          files: ./packages/custom-namespace/coverage/lcov.info
          flags: custom-namespace
          fail_ci_if_error: true
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: Build
        run: pnpm run build

      # Runs on every OS, unlike the static gates: this one EXECUTES the
      # bundles, so the platform and its V8 are part of what is under test.
      - name: Smoke the built bundles
        run: pnpm run smoke:check

      - name: Verify package contents (pack dry-run)
        if: matrix.os == 'ubuntu-latest'
        run: pnpm run pack:check

      - name: Verify publish gates (attw + publint)
        if: matrix.os == 'ubuntu-latest'
        run: pnpm run check:publish

      # The module builds had never been executed outside V8. `browser:check`
      # covers three engines but loads the UMD bundle alone, and every step
      # above runs on Node — so the ESM and CJS artifacts, which are what a
      # package manager actually installs, had one engine behind them.
      #
      # Bun executes JavaScriptCore and consumes exactly those two artifacts,
      # which makes it the cheapest non-V8 coverage available for them: one
      # binary, no browser download. It is what puts a real second engine
      # behind `hasJavaScriptCoreBindBehavior` and the reading it selects —
      # and it is the only gate that can catch a BUILD-level break of that
      # probe, since on V8 a broken probe and a working one both answer
      # `false`.
      #
      # `umd` is excluded: that path loads through `node:vm`, which Bun
      # implements only in part, and the browser matrix already executes the
      # UMD on three engines.
      #
      # Installed by pinned VERSION through npm rather than through an action,
      # so there is no third-party SHA to track for a single binary. Not part
      # of `check` or `check:full`: those must run on a contributor's machine
      # with nothing but the workspace toolchain, and `gates:check` therefore
      # makes no demand about it.
      - name: Execute the module builds on JavaScriptCore (Bun)
        if: matrix.os == 'ubuntu-latest'
        run: |
          npm install --global bun@1.4.2
          bun --version
          SPECIES_SMOKE_ONLY=esm,cjs bun scripts/check-bundle-smoke.mjs
          # Asserts this JOB'S PREMISE, not the library's behavior. The probes
          # above check that the realm probe AGREES with what the runtime
          # renders, which holds whichever way it answers — so a green there is
          # consistent with Bun behaving exactly like V8, in which case this
          # step would cover the JavaScriptCore reading not at all while looking
          # like it did.
          #
          # Measured 2026-09-08 on bun 1.4.2: both answers are `true`, so this
          # job really does exercise the reading that only a name-rendering
          # engine selects. Recorded first, then asserted — the sequence
          # `browser.probes.mjs` uses for a new engine profile.
          #
          # A red here does not mean the library broke. It means Bun stopped
          # rendering the bound target's name, or the realm probe stopped
          # detecting that it does, and either way this job silently stopped
          # covering what it was added for.
          bun -e '
            import("./packages/function-introspection/dist/node/public.js").then((m) => {
              const rendersName =
                m.getCondensedFunctionSource(function named() {}.bind(null)) !==
                "function(){[native code]}";
              const selected = m.hasJavaScriptCoreBindBehavior();
              console.log(
                `realm: hasJavaScriptCoreBindBehavior=${selected} ` +
                  `rendersBoundTargetName=${rendersName}`,
              );
              if (selected !== true || rendersName !== true) {
                console.error(
                  "\u2717 this runtime no longer selects the JavaScriptCore reading, so " +
                    "this job has stopped covering it. Re-measure before relaxing this.",
                );
                process.exit(1);
              }
            }).catch((error) => {
              console.error(`\u2717 realm could not be read — ${error.message}`);
              process.exit(1);
            });
          '

      # Each package declares `engines.node: ">=18"` — the CONSUMER floor of
      # ADR #078. Until now that was a convention held up by an ES2020 source
      # rule and, since today, a syntax scan over the built output. Neither
      # executes anything, so neither proves the floor.
      #
      # This does. The UMD bundle inlines every dependency, so it needs no
      # install and no module resolution — which is what makes a Node-18 job
      # possible at all here: `engine-strict=true` plus the root `>=22.11`
      # contributor floor would refuse to install this workspace on Node 18.
      # Running the UMD executes every line of library code, BOTH packages
      # (type-detection is inlined), on the runtime the packages promise.
      #
      # Deliberately last in the job: it switches the runtime, and nothing
      # after it should inherit that.
      - name: Set up the consumer floor (Node 18)
        if: matrix.os == 'ubuntu-latest'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 18

      - name: Execute the UMD bundles on Node 18
        if: matrix.os == 'ubuntu-latest'
        env:
          SPECIES_SMOKE_ONLY: umd
        run: node scripts/check-bundle-smoke.mjs
