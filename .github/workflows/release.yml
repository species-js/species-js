name: Release

on:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  release:
    name: Version & Publish
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm run build

      - name: Create release PR (publish disabled until first manual bootstrap)
        uses: changesets/action@198f833dd7d863100ea6e28967bc9a9fdefadb0a # v2.1.0
        with:
          version: pnpm changeset version
          # publish: pnpm changeset publish
          #
          # The `publish` input is intentionally disabled.
          #
          # changesets/action's behavior when `publish` is set AND no changesets
          # are pending is to fall back to "publish any unpublished packages to
          # npm" — which fails with E404 on a fresh monorepo where no version
          # has ever been pushed to the registry, and breaks every release-
          # workflow run until the bootstrap publish happens.
          #
          # Re-enable this line (and set the NPM_TOKEN repo secret) when you
          # are ready to publish the first real release. Until then, this
          # workflow only opens "Version Packages" PRs from pending changesets.
          #
          # ADR #093 fixes the order: run `bootstrap-publish.yml` ONCE, then
          # uncomment the line above and delete that workflow.
          #
          # Inert until `publish` is on, and stated explicitly rather than left
          # to the action's default: each published version gets a GitHub
          # Release carrying the changelog entry already being generated.
          createGithubReleases: true
          title: 'chore: version packages'
          commit: 'chore: version packages'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
