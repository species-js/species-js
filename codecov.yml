# Codecov configuration.
#
# Coverage is reported BOTH per package and in aggregate. Flags are what make
# the per-package view exist: without them Codecov merges every uploaded lcov
# file into one project number and the distinction is gone. With them, the
# project number is still computed — flags add granularity, they do not replace
# the total.
#
# One flag per publishable package, each fed by its own upload step in
# `.github/workflows/ci.yml`. A package earns an entry here on the commit that
# makes it PUBLISHABLE — a frozen spec, a suite derived from it, and coverage
# clearing the workspace thresholds (ADR #092, as amended 2026-09-03).
#
# Surface alone is NOT the trigger, and the earlier wording said it was. Both
# private scaffolds had a real surface while carrying a single importability
# test each, so following that instruction would have added flags reporting on
# nothing and diluted the aggregate.

coverage:
  status:
    project:
      default:
        target: auto
        # Tolerate ordinary noise, fail on a real regression.
        threshold: 1%
    patch:
      default:
        target: auto

flag_management:
  default_rules:
    # A flag whose tests did not run in a given CI job keeps its previous
    # value rather than reporting zero. Without this a partial run reads as a
    # coverage collapse.
    carryforward: true
  individual_flags:
    - name: type-detection
      paths:
        - packages/type-detection/
    - name: function-introspection
      paths:
        - packages/function-introspection/

comment:
  layout: 'reach, diff, flags, files'
  require_changes: true
